name: Publish Archify diagrams to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "diagrams/archify/**"
      - ".github/workflows/archify-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Archify site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Prepare Archify site
        shell: bash
        run: |
          test -s diagrams/archify/00-sno-upi-comparison.html
          test -s diagrams/archify/01-sno-ipi-detail.html
          test -s diagrams/archify/02-upi-detail.html
          mkdir -p _site
          cp -R diagrams/archify/. _site/
          cp diagrams/archify/00-sno-upi-comparison.html _site/index.html

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
