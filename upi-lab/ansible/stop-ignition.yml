---
- name: Stop serving cluster-specific Ignition after installation
  hosts: installer
  become: true
  gather_facts: false
  tasks:
    - name: Validate the cluster infrastructure ID
      ansible.builtin.assert:
        that:
          - ignition_infra_id is defined
          - ignition_infra_id is match('^[a-z0-9-]+$')

    - name: Stop and disable Apache
      ansible.builtin.systemd_service:
        name: httpd
        state: stopped
        enabled: false

    - name: Remove the served cluster-specific Ignition directory
      ansible.builtin.file:
        path: "/var/www/html/openshift-upi-lab/{{ ignition_infra_id }}"
        state: absent

    - name: Check that Apache is inactive
      ansible.builtin.command: systemctl is-active httpd
      register: ignition_httpd_status
      changed_when: false
      failed_when: ignition_httpd_status.stdout | trim != 'inactive'

    - name: Check that the served Ignition directory is absent
      ansible.builtin.stat:
        path: "/var/www/html/openshift-upi-lab/{{ ignition_infra_id }}"
      register: served_ignition_directory

    - name: Validate that private Ignition serving was removed
      ansible.builtin.assert:
        that:
          - not served_ignition_directory.stat.exists
