---
- name: Apply Bootstrap-stage DNS one server at a time
  hosts: dns_ntp
  become: true
  serial: 1
  vars:
    cluster_stage: bootstrap
  roles:
    - dns_ntp

- name: Apply Bootstrap-stage HAProxy one host at a time
  hosts: haproxy
  become: true
  serial: 1
  vars:
    cluster_stage: bootstrap
  roles:
    - haproxy
