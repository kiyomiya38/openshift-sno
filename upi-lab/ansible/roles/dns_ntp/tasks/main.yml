---
- name: Install BIND and chrony
  ansible.builtin.dnf:
    name:
      - bind
      - bind-utils
      - chrony
    state: present

- name: Install BIND configuration
  ansible.builtin.template:
    src: named.conf.j2
    dest: /etc/named.conf
    owner: root
    group: named
    mode: "0640"
    validate: /usr/sbin/named-checkconf %s
  notify: Restart named

- name: Install forward zone
  ansible.builtin.template:
    src: db.forward.j2
    dest: "/var/named/db.{{ cluster_domain }}"
    owner: root
    group: named
    mode: "0640"
  notify: Restart named

- name: Install reverse zone
  ansible.builtin.template:
    src: db.reverse.j2
    dest: /var/named/db.10.80
    owner: root
    group: named
    mode: "0640"
  notify: Restart named

- name: Validate forward zone
  ansible.builtin.command:
    argv:
      - /usr/sbin/named-checkzone
      - "{{ cluster_domain }}"
      - "/var/named/db.{{ cluster_domain }}"
  changed_when: false

- name: Validate reverse zone
  ansible.builtin.command:
    argv:
      - /usr/sbin/named-checkzone
      - 80.10.in-addr.arpa
      - /var/named/db.10.80
  changed_when: false

- name: Configure chrony with AWS Time Sync Service
  ansible.builtin.template:
    src: chrony.conf.j2
    dest: /etc/chrony.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart chronyd

- name: Open DNS and NTP ports in firewalld
  ansible.posix.firewalld:
    service: "{{ item }}"
    permanent: true
    immediate: true
    state: enabled
  loop:
    - dns
    - ntp

- name: Enable DNS and NTP services
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - named
    - chronyd
