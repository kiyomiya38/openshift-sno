---
- name: Install HAProxy
  ansible.builtin.dnf:
    name: haproxy
    state: present

- name: Permit HAProxy backend connections in SELinux
  ansible.posix.seboolean:
    name: haproxy_connect_any
    state: true
    persistent: true

- name: Label HAProxy listener ports for SELinux
  community.general.seport:
    ports: "{{ item }}"
    proto: tcp
    setype: http_port_t
    state: present
  loop:
    - "1936"
    - "6443"
    - "22623"

- name: Install HAProxy configuration
  ansible.builtin.template:
    src: haproxy.cfg.j2
    dest: /etc/haproxy/haproxy.cfg
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/haproxy -c -f %s
  notify: Reload haproxy

- name: Open HAProxy listener ports in firewalld
  ansible.posix.firewalld:
    port: "{{ item }}/tcp"
    permanent: true
    immediate: true
    state: enabled
  loop:
    - "80"
    - "443"
    - "1936"
    - "6443"
    - "22623"

- name: Enable HAProxy
  ansible.builtin.systemd_service:
    name: haproxy
    enabled: true
    state: started
