---
- name: Install NFS server packages
  ansible.builtin.dnf:
    name: nfs-utils
    state: present

- name: Create the OpenShift NFS export
  ansible.builtin.file:
    path: "{{ nfs_export_path }}"
    state: directory
    owner: nobody
    group: nobody
    mode: "0770"

- name: Permit read-write NFS exports in SELinux
  ansible.posix.seboolean:
    name: nfs_export_all_rw
    state: true
    persistent: true

- name: Install NFS export definition
  ansible.builtin.template:
    src: openshift.exports.j2
    dest: /etc/exports.d/openshift.exports
    owner: root
    group: root
    mode: "0644"
  notify: Reload NFS exports

- name: Open NFS in firewalld
  ansible.posix.firewalld:
    service: nfs
    permanent: true
    immediate: true
    state: enabled

- name: Enable NFS server
  ansible.builtin.systemd_service:
    name: nfs-server
    enabled: true
    state: started

- name: Apply NFS exports now
  ansible.builtin.command: /usr/sbin/exportfs -ra
  changed_when: false
