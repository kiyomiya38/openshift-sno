---
- name: Restart squid
  ansible.builtin.systemd_service:
    name: squid
    state: restarted

- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Restart mirror registry
  ansible.builtin.systemd_service:
    name: mirror-registry.service
    state: restarted
  failed_when: false
