[defaults]
inventory = inventory/hosts.yml
roles_path = roles
remote_user = ec2-user
private_key_file = ~/.ssh/openshift_upi_lab
host_key_checking = True
interpreter_python = auto_silent
retry_files_enabled = False
timeout = 20

[ssh_connection]
ssh_args = -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30 -o ServerAliveCountMax=3
pipelining = True
